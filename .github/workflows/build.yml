name: Build All & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  linux-bin-and-snap-release:
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconfigure git to use HTTP authentication
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "::set-output name=dir::$(npm config get cache)"
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install npm Packages
        run: npm install
      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium
          npx playwright install-deps chromium
      - run: npm run env
      - name: Lint
        run: npm run lint:ci
      - name: Test Unit
        run: npm run test
      - name: Test E2E
        run: npm run e2e
      - name: 'Upload E2E results on failure'
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2eResults
          path: .tmp/e2e-test-results/**/*.*
          retention-days: 14
      - name: Build Frontend & Electron
        run: npm run build
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v3
      - name: Build/Release Electron app
        uses: johannesjo/action-electron-builder@v1
        with:
          build_script_name: empty
          github_token: ${{ secrets.github_token }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
      - run: |
          find ./.tmp/app-builds -type f -name '*.snap' -exec sh -c '
            x="{}"
            mv "$x" ".tmp/app-builds/sp.snap"
          ' \;

  mac-bin:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Echo is Release
        run: echo "IS_RELEASE ${{ startsWith(github.ref, 'refs/tags/v') }}"
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconfigure git to use HTTP authentication
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "::set-output name=dir::$(npm config get cache)"
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Workaround for nx issue and dmg licence issue
        run: npm install @nx/nx-darwin-arm64 dmg-license
      - name: Install npm Packages
        run: npm install
      - name: Decode provisioning profile
        run: |
          echo "${{ secrets.dl_provision_profile }}" | base64 --decode > embedded.provisionprofile
      - name: Prepare for app notarization
        run: |
          mkdir -p ~/private_keys/
          echo "${{ secrets.mac_api_key }}" > ~/private_keys/AuthKey_${{ secrets.mac_api_key_id }}.p8
      - run: npm run env
      - name: Lint
        run: npm run lint:ci
      - name: Test Unit
        run: npm run test
      - name: Build Frontend & Electron
        run: npm run build
      - name: Build/Release Electron app
        uses: johannesjo/action-electron-builder@v1
        with:
          build_script_name: empty
          github_token: ${{ secrets.github_token }}
          mac_certs: ${{ secrets.mac_certs }}
          mac_certs_password: ${{ secrets.mac_certs_password }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          API_KEY_ID: ${{ secrets.mac_api_key_id }}
          API_KEY_ISSUER_ID: ${{ secrets.mac_api_key_issuer_id }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  windows-bin:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Set timezone to Europe Standard Time
        uses: szenius/set-timezone@v2.0
        with:
          timezoneWindows: 'W. Europe Standard Time'
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconfigure git to use HTTP authentication
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "::set-output name=dir::$(npm config get cache)"
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Workaround for nx issue
        run: npm install @nx/nx-win32-x64-msvc
      - name: Install npm Packages
        run: npm install
      - run: npm run env
      - name: Lint
        run: npm run lint:ci
      - name: Test Unit
        run: npm run test
      - name: Build Frontend & Electron
        run: npm run build
      - name: Build/Release Electron app
        uses: johannesjo/action-electron-builder@v1
        with:
          build_script_name: empty
          github_token: ${{ secrets.github_token }}
          release: true
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v3
        with:
          name: super-productivity-win
          path: .tmp/app-builds/*.exe
